# 浩煜 — Nginx 反代配置
# 放入 /etc/nginx/sites-available/haoyu 后 ln -s 到 sites-enabled

server {
    listen 80;
    server_name www.haoyulv.com haoyulv.com;

    # 前端静态文件
    root /var/www/haoyu;
    index index.html;

    # API 反代 → 后端
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件
    location /uploads/ {
        alias /root/.openclaw/workspace/haoyu-repo/apps/backend/uploads/;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
